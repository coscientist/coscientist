name: coscientist
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: coscientist
      POSTGRES_PASSWORD: coscientist
      POSTGRES_DB: coscientist
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      - coscientist_pg:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coscientist -d coscientist']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  coscientist_pg:
